[workspace]
members = ["."]

[workspace.package]
version = "2.0.0"

[package]
name = "gif-engine"
version.workspace = true
edition = "2024"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
image = { version = "0.24", features = ["default", "jpeg", "png", "webp", "bmp", "ico", "tiff"] }
gif = "0.12"
png = "0.17"
winit = "0.29"
softbuffer = "0.4"
dialoguer = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console = "0.15"
sysinfo = "0.38.0"
tray-icon = "0.21.3"
menu_rs = "0.3.1"
eframe = "0.27"
egui = "0.27"
rfd = "0.14"
auto-launch = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
webbrowser = "0.8"
whoami = "1.5"
zip = "0.6"
rand = "0.8"



[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System",
    "Win32_System_LibraryLoader"
]}

